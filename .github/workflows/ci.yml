name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # lib/env.ts validates this at import time. No real database is needed —
  # nothing in CI executes a query against it (see CLAUDE.md #40 / issue #5).
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
