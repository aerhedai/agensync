name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # A real Postgres service (below), not a dummy string — Phase 2's
  # integration tests need an actual database to create/read rows against.
  DATABASE_URL: postgresql://agensync:agensync@localhost:5432/agensync

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agensync
          POSTGRES_PASSWORD: agensync
          POSTGRES_DB: agensync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agensync -d agensync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
