name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # A real Postgres service (below), not a dummy string — Phase 2's
  # integration tests need an actual database to create/read rows against.
  DATABASE_URL: postgresql://aperator:aperator@localhost:5432/aperator
  # Ollama is a private Tailscale host CI cannot reach — lib/env.ts only
  # validates these are shaped correctly, nothing in CI calls Ollama over
  # the network (the Ollama provider test mocks fetch).
  OLLAMA_BASE_URL: http://ollama.invalid:11434
  AI_PROVIDER: ollama
  # Shape-valid dummy values, same rationale as OLLAMA_BASE_URL above:
  # lib/env.ts's eager parse and `pnpm build` need these present, but no
  # test or build step ever makes a real Clerk API call or decrypts real
  # data — nothing in CI needs these to be genuine secrets.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXktY2xlcmsta2V5LWZvci1jaS5jbGVyay5hY2NvdW50cy5kZXYk
  CLERK_SECRET_KEY: sk_test_ZHVtbXktY2xlcmstc2VjcmV0LWtleS1mb3ItY2ktb25seQ
  TOKEN_ENCRYPTION_KEY: VAbwbKlEAJsczJIK4qu/Or5WWwOYJ86VZJ94gwtcRHM=
  # Same reasoning as SLACK_* below: tests/unit/google-oauth-core.test.ts
  # calls exchangeCodeForTokens/buildGoogleAuthUrl directly (fetch mocked,
  # but requireGoogleConfig's env check still runs for real) — added up
  # front, not after a failing CI run.
  GOOGLE_CLIENT_ID: dummy-ci-google-client-id
  GOOGLE_CLIENT_SECRET: dummy-ci-google-client-secret
  GOOGLE_REDIRECT_URI: http://localhost:3000/api/integrations/gmail/callback
  GOOGLE_DRIVE_REDIRECT_URI: http://localhost:3000/api/integrations/google-drive/callback
  SLACK_CLIENT_ID: dummy-ci-slack-client-id
  SLACK_CLIENT_SECRET: dummy-ci-slack-client-secret
  SLACK_REDIRECT_URI: http://localhost:3000/api/integrations/slack/callback
  # Same reasoning as SLACK_* above: the Microsoft unit tests call
  # exchangeCodeForTokens/buildMicrosoftAuthUrl directly (fetch mocked, but
  # requireMicrosoftConfig's env check still runs for real).
  MICROSOFT_CLIENT_ID: dummy-ci-microsoft-client-id
  MICROSOFT_CLIENT_SECRET: dummy-ci-microsoft-client-secret
  MICROSOFT_OUTLOOK_REDIRECT_URI: http://localhost:3000/api/integrations/outlook/callback
  MICROSOFT_TEAMS_REDIRECT_URI: http://localhost:3000/api/integrations/teams/callback
  MICROSOFT_CALENDAR_REDIRECT_URI: http://localhost:3000/api/integrations/outlook-calendar/callback
  MICROSOFT_SHAREPOINT_REDIRECT_URI: http://localhost:3000/api/integrations/sharepoint/callback

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aperator
          POSTGRES_PASSWORD: aperator
          POSTGRES_DB: aperator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aperator -d aperator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
