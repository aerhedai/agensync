services:
  postgres:
    # pgvector/pgvector rather than plain postgres: the knowledge base
    # needs the `vector` extension, which the stock image doesn't ship.
    # Same Postgres 16 underneath, and the same version Neon provides.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aperator
      POSTGRES_PASSWORD: aperator
      POSTGRES_DB: aperator
    ports:
      # Host port 5433, not 5432 — this machine already has other local
      # Postgres installs (Homebrew, Postgres.app) bound to localhost:5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperator -d aperator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
